[project]
name = "agentic-chatbot"
version = "0.1.0"
description = "Agentic chatbot built with LangGraph, Google Gemini, and Streamlit."
readme = "README.md"
authors = [
    { name = "Mounsef27", email = "monsaf.debbache@g.enp.edu.dz" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "google-genai>=3.3.0",
    "httpx>=0.27",
    "langchain>=1.4.10",
    "langchain-google-genai>=4.5.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.14.17",
    "python-dotenv>=1.2.4",
    "streamlit>=1.50.0",
    "typing>=3.10.0.0",
]

[project.scripts]
agentic-chatbot = "agentic_chatbot:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
